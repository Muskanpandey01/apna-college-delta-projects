<div class="container">
    <h2>Form Demo</h2>
    <form class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="text" class="form-control" placeholder="Email" id="email">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control-sm" placeholder="Password" id="password">
        <label class="form-label" for="submit">Submit</label>
        <input type="submit" class="form-contro-sml" placeholder="Submit" id="submit">

        <div class="mb-3">
            <select class="form-select-sm">
                <option>select something</option>
                <option value="1">one</option>
                  <option value="2">two</option>
                  <option value="3">three</option>
            </select>
        </div>

        <div class="normal mb-3">
            <label for="agree">Agree</label>
            <input type="checkbox" id="agree">
        </div>
    </form>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
